[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mikrotik-client-monitor"
version = "0.1.0"
description = "SSH based MikroTik client location exporter for Prometheus"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "MikroTik Client Monitor contributors"}]
dependencies = [
    "protobuf>=5,<8",
    "python-snappy>=0.7,<1",
    "requests>=2.31,<3",
    "python-dotenv>=1,<2",
]

[project.scripts]
mikrotik-client-monitor = "mikrotik_client_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
